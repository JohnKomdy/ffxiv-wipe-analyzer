<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFXIV Live Wipe Graph Generator</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <main class="app-container">
    <section class="sidebar">
      <div class="card">
        <div class="section-header">
          <h3>Players</h3>
          <button id="shareSettingsBtn" class="btn-share">Share Roster Settings</button>
        </div>
        <div id="charButtons" class="btn-grid"></div>
        <div class="control-row">
          <input type="text" id="customCharInput" placeholder="Add player name...">
          <button id="addCharBtn" class="btn-secondary">Add</button>
          <button id="removeCharBtn" class="btn-danger">Remove Selected</button>
        </div>

        <h3>Mechanics</h3>
        <div id="mechButtons" class="btn-grid"></div>
        <div class="control-row">
          <input type="text" id="customMechInput" placeholder="Add mechanic name...">
          <button id="addMechBtn" class="btn-secondary">Add</button>
          <button id="removeMechBtn" class="btn-danger">Remove Selected</button>
        </div>

        <button id="addLogBtn" class="add-btn">+ Record Wipe Entry</button>
      </div>

      <div class="card">
        <h3>Current Session Log</h3>
        <div class="file-status-banner">
          <span id="statusText">No master log linked</span>
        </div>
        <textarea id="logTextarea" spellcheck="false" placeholder="Wipe entries will appear here..."></textarea>
        
        <div class="action-row">
          <button id="loadLogBtn" class="action-btn">Link Existing Log (.txt)</button>
        </div>
        <button id="endSessionBtn" class="end-session-btn">Export & Append Session</button>
      </div>
    </section>

    <section class="card chart-section">
      <div class="chart-header">Player Fault Breakdown</div>
      <div class="chart-container">
        <canvas id="wipeChart"></canvas>
      </div>
    </section>
  </main>

  <input type="file" id="fileInput" accept=".txt" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
